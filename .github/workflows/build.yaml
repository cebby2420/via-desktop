name: Build

on:
  schedule:
    - cron: "0 12 * * 1"
  pull_request:
  push:
    branches:
      - main
  repository_dispatch:
    types: [definition_update]
  workflow_dispatch:

permissions: {}

jobs:
  build_assets:
    runs-on: ubuntu-latest
    name: Build VIA assets
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: the-via/app
          fetch-depth: 0
          persist-credentials: false
      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: |
          bun install
          bun run refresh-kbs
      - name: Apply patches
        run: |
          sed -i 's|^\(\s*\)//\(.*fetch.*\)|\1\2|; s|^\(\s*\)\(const hash = document.getElementById.*\)|\1//\2|' src/utils/device-store.ts
          sed -i 's/dispatch(loadStoredCustomDefinitions/await dispatch(loadStoredCustomDefinitions/' src/store/devicesThunks.ts
          sed -i 's/dispatch(setForceAuthorize(true))/dispatch(setForceAuthorize(false))/' src/store/devicesThunks.ts
      - name: Build
        run: bun run build
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: via-build
          path: dist/
          retention-days: 1
      - name: Prepare draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          BASE_VERSION="$(date +'%Y.%-m.%-d')"
          VERSION="$BASE_VERSION"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            if gh api "repos/$REPOSITORY/git/ref/tags/v$BASE_VERSION" >/dev/null 2>&1 \
              || gh release view "v$BASE_VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
              VERSION="${BASE_VERSION}-r${RUN_NUMBER}"
            fi
            gh release create "v$VERSION" \
              --repo "$REPOSITORY" \
              --title "v$VERSION" \
              --draft \
              --generate-notes \
              --target "$TARGET_SHA"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: build_assets
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64]
        include:
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Build VIA-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: Install Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: via-build
          path: public/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Set release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build_assets.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version
      - name: Publish for ${{ matrix.os }}
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_ARCH: ${{ matrix.arch }}
        # electron-forge publish uploads to GitHub Releases, not the npm registry.
        run: npm run publish -- --arch "$TARGET_ARCH" # zizmor: ignore[use-trusted-publishing]
      - name: Build for ${{ matrix.os }}
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: npm run make -- --arch "$TARGET_ARCH"
      - name: Upload PR build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: via-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: out/make/
          if-no-files-found: error
          retention-days: 14

  comment_pr_artifacts:
    needs: [build_assets, build]
    if: github.event_name == 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    name: Comment with PR build artifacts
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Comment with artifact links
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const pullNumber = context.payload.pull_request.number;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: runId, per_page: 100 },
            );
            const buildArtifacts = artifacts.filter(
              (artifact) => artifact.name.startsWith('via-desktop-') && !artifact.expired,
            );
            const marker = '<!-- via-desktop-pr-build-artifacts -->';
            const artifactLines = buildArtifacts.length
              ? buildArtifacts.map((artifact) => {
                  const sizeMiB = (artifact.size_in_bytes / (1024 * 1024)).toFixed(1);
                  const expires = new Date(artifact.expires_at).toISOString().slice(0, 10);
                  const url = `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${artifact.id}`;
                  return `- [${artifact.name}](${url}) — ${sizeMiB} MiB; expires ${expires}`;
                }).join('\n')
              : 'No downloadable build artifacts were found for this run.';
            const body = [
              marker,
              '### PR build artifacts',
              '',
              'Download the packaged builds below. Each link downloads that platform/architecture artifact as a ZIP; the ZIP contains the files produced by Electron Forge.',
              '',
              artifactLines,
              '',
              `[View workflow run and logs](https://github.com/${owner}/${repo}/actions/runs/${runId})`,
            ].join('\n');
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pullNumber, per_page: 100 },
            );
            const existing = comments.find((comment) =>
              comment.body?.includes(marker) && comment.user?.type === 'Bot',
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body,
              });
            }

  publish_release:
    needs: [build_assets, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Publish GitHub release
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build_assets.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "v$RELEASE_VERSION" --repo "$REPOSITORY" --draft=false
