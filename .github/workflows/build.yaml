name: Build

on:
  schedule:
    - cron: "0 12 * * 1"
  pull_request:
  push:
    branches:
      - main
  repository_dispatch:
    types: [definition_update]
  workflow_dispatch:

jobs:
  build_assets:
    runs-on: ubuntu-latest
    name: Build VIA assets
    permissions:
      contents: write
    outputs:
      via-build-artifact: ${{ steps.upload-artifact.outputs.artifact-id }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: the-via/app
          fetch-depth: 0
      - name: Use Bun
        uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: |
          bun install
          bun run refresh-kbs
      - name: Apply patches
        run: |
          sed -i 's|^\(\s*\)//\(.*fetch.*\)|\1\2|; s|^\(\s*\)\(const hash = document.getElementById.*\)|\1//\2|' src/utils/device-store.ts
          sed -i 's/dispatch(loadStoredCustomDefinitions/await dispatch(loadStoredCustomDefinitions/' src/store/devicesThunks.ts
          sed -i 's/dispatch(setForceAuthorize(true))/dispatch(setForceAuthorize(false))/' src/store/devicesThunks.ts
      - name: Build
        run: bun run build
      - name: Upload artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: via-build
          path: dist/
          retention-days: 1
      - name: Prepare draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_VERSION="$(date +'%Y.%-m.%-d')"
          VERSION="$BASE_VERSION"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if gh api "repos/${{ github.repository }}/git/ref/tags/v$BASE_VERSION" >/dev/null 2>&1 \
              || gh release view "v$BASE_VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              VERSION="${BASE_VERSION}-${{ github.run_number }}"
            fi
            gh release create "v$VERSION" \
              --repo "${{ github.repository }}" \
              --title "v$VERSION" \
              --draft \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: build_assets
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64]
        include:
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Build VIA-desktop
    steps:
      - uses: actions/checkout@v4
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: Install Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.build_assets.outputs.via-build-artifact }}
      - run: mv via-build/ public/
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Set release version
        run: npm version ${{ needs.build_assets.outputs.version }} --no-git-tag-version
      - name: Publish for ${{ matrix.os }}
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish -- --arch ${{ matrix.arch }}
      - name: Build for ${{ matrix.os }}
        if: github.event_name == 'pull_request'
        run: npm run make -- --arch ${{ matrix.arch }}

  publish_release:
    needs: [build_assets, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Publish GitHub release
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.build_assets.outputs.version }}" --repo "${{ github.repository }}" --draft=false
