name: Build

on:
  schedule:
    - cron: "0 12 * * 1"
  pull_request:
  push:
    branches:
      - main
  repository_dispatch:
    types: [definition_update]
  workflow_dispatch:

permissions: {}

jobs:
  build_assets:
    runs-on: ubuntu-latest
    name: Build VIA assets
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: the-via/app
          fetch-depth: 0
          persist-credentials: false
      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: |
          bun install
          bun run refresh-kbs
      - name: Apply patches
        run: |
          sed -i 's|^\(\s*\)//\(.*fetch.*\)|\1\2|; s|^\(\s*\)\(const hash = document.getElementById.*\)|\1//\2|' src/utils/device-store.ts
          sed -i 's/dispatch(loadStoredCustomDefinitions/await dispatch(loadStoredCustomDefinitions/' src/store/devicesThunks.ts
          sed -i 's/dispatch(setForceAuthorize(true))/dispatch(setForceAuthorize(false))/' src/store/devicesThunks.ts
      - name: Build
        run: bun run build
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: via-build
          path: dist/
          retention-days: 1
      - name: Prepare draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          BASE_VERSION="$(date +'%Y.%-m.%-d')"
          VERSION="$BASE_VERSION"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            if gh api "repos/$REPOSITORY/git/ref/tags/v$BASE_VERSION" >/dev/null 2>&1 \
              || gh release view "v$BASE_VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
              VERSION="${BASE_VERSION}-r${RUN_NUMBER}"
            fi
            gh release create "v$VERSION" \
              --repo "$REPOSITORY" \
              --title "v$VERSION" \
              --draft \
              --generate-notes \
              --target "$TARGET_SHA"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: build_assets
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64]
        include:
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Build VIA-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: Install Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: via-build
          path: public/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Set release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build_assets.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version
      - name: Publish for ${{ matrix.os }}
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_ARCH: ${{ matrix.arch }}
        # electron-forge publish uploads to GitHub Releases, not the npm registry.
        run: npm run publish -- --arch "$TARGET_ARCH" # zizmor: ignore[use-trusted-publishing]
      - name: Build for ${{ matrix.os }}
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: npm run make -- --arch "$TARGET_ARCH"

  publish_release:
    needs: [build_assets, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Publish GitHub release
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build_assets.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "v$RELEASE_VERSION" --repo "$REPOSITORY" --draft=false
