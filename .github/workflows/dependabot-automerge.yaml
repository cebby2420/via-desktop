name: Dependabot Auto-Merge

on:
  # Required for Dependabot PRs to receive write permissions; no PR code is checked out.
  pull_request_target: # zizmor: ignore[dangerous-triggers]

permissions: {}

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # 49699333 is dependabot[bot]'s immutable GitHub user ID.
    if: github.event.sender.id == 49699333
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Approve and enable auto-merge for minor/patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
